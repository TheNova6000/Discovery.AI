<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none" stroke="#2f6f4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Dewey waving hello">
  <!-- hair tufts -->
  <path d="M78 46 C 76 34, 82 28, 86 38" />
  <path d="M92 40 C 91 27, 99 23, 101 36" />
  <path d="M108 42 C 110 30, 118 28, 118 40" />

  <!-- head -->
  <circle cx="98" cy="66" r="34" />

  <!-- glasses -->
  <circle cx="83" cy="68" r="11" />
  <circle cx="113" cy="68" r="11" />
  <path d="M94 67 C 97 64, 99 64, 102 67" />
  <path d="M72 66 C 66 65, 64 68, 62 70" />
  <path d="M124 66 C 130 65, 133 68, 135 70" />

  <!-- eyes (behind glasses) -->
  <circle cx="83" cy="69" r="1.6" fill="#2f6f4f" stroke="none" />
  <circle cx="113" cy="69" r="1.6" fill="#2f6f4f" stroke="none" />

  <!-- smile -->
  <path d="M86 82 C 94 90, 102 90, 110 81" />

  <!-- rosy cheek marks (doodle flourish) -->
  <path d="M74 78 C 76 80, 76 82, 74 83" stroke-width="2.5" />
  <path d="M122 78 C 120 80, 120 82, 122 83" stroke-width="2.5" />

  <!-- neck + sweater body -->
  <path d="M88 98 L 90 110 L 108 110 L 110 98" />
  <path d="M70 190 C 68 150, 78 118, 92 112 L 106 112 C 120 118, 130 150, 130 190 Z" />
  <!-- v-neck -->
  <path d="M92 112 L 100 128 L 108 112" />

  <!-- left arm resting -->
  <path d="M78 122 C 62 130, 56 150, 60 168" />
  <circle cx="60" cy="172" r="6" />

  <!-- right arm waving up -->
  <path d="M120 120 C 136 108, 148 88, 146 66" />
  <!-- waving hand -->
  <g stroke-width="3.5">
    <path d="M146 66 C 142 60, 144 54, 150 54" />
    <path d="M150 54 C 150 48, 156 46, 158 52" />
    <path d="M158 52 C 160 47, 166 47, 166 53" />
    <path d="M166 53 C 168 49, 173 50, 172 56" />
    <circle cx="150" cy="64" r="7" />
  </g>
</svg>
