<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none" stroke="#2f6f4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Dewey thinking, composing a lesson">
  <!-- hair tufts -->
  <path d="M78 46 C 76 34, 82 28, 86 38" />
  <path d="M92 40 C 91 27, 99 23, 101 36" />
  <path d="M108 42 C 110 30, 118 28, 118 40" />

  <!-- head, tilted slightly -->
  <circle cx="96" cy="66" r="34" />

  <!-- raised eyebrow (doodle flourish for "thinking") -->
  <path d="M104 52 C 110 48, 118 48, 122 52" stroke-width="3" />

  <!-- glasses -->
  <circle cx="82" cy="68" r="11" />
  <circle cx="112" cy="68" r="11" />
  <path d="M93 67 C 96 64, 98 64, 101 67" />
  <path d="M71 66 C 65 65, 63 68, 61 70" />
  <path d="M123 66 C 129 65, 132 68, 134 70" />

  <!-- eyes looking up-and-away, thinking -->
  <circle cx="80" cy="66" r="1.6" fill="#2f6f4f" stroke="none" />
  <circle cx="110" cy="66" r="1.6" fill="#2f6f4f" stroke="none" />

  <!-- small, thoughtful mouth -->
  <path d="M90 84 C 95 86, 100 86, 103 83" />

  <!-- thought bubbles -->
  <circle cx="150" cy="34" r="3" stroke-width="3" />
  <circle cx="158" cy="24" r="4.5" stroke-width="3" />
  <circle cx="170" cy="12" r="9" stroke-width="3" />

  <!-- neck + sweater body -->
  <path d="M86 98 L 88 110 L 106 110 L 108 98" />
  <path d="M68 190 C 66 150, 76 118, 90 112 L 104 112 C 118 118, 128 150, 128 190 Z" />
  <path d="M90 112 L 98 128 L 106 112" />

  <!-- right arm bent up, hand resting on chin -->
  <path d="M112 120 C 126 116, 132 104, 128 92" />
  <circle cx="126" cy="88" r="7" />
  <path d="M120 86 C 118 82, 116 80, 112 80" stroke-width="3" />

  <!-- left arm holding a small book against the body -->
  <path d="M76 124 C 64 130, 58 142, 60 154" />
  <rect x="46" y="150" width="26" height="19" rx="2" />
  <path d="M59 150 L 59 169" />
</svg>
